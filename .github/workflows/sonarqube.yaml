---
# SonarQube static analysis, reporting to the org-level SONAR_HOST_URL secret.
#
# `runs-on: arc-shared` is load-bearing. The SonarQube host is VPN-only and a
# GitHub-hosted runner cannot resolve it. arc-shared is the in-cluster ARC
# runner scale set defined in dodopayments/devops
# (infra-apps/prod/apps/arc-shared). A job that queues instead of starting
# means the repo is missing from the arc-shared runner group, which is an org
# setting rather than a property of this file.
#
# push-to-main only. SonarQube Community Build analyses the main branch alone.
# PR and branch analysis are Developer Edition features. Without usable PR
# parameters the scanner attributes every analysis to MAIN, so a scan from any
# non-main ref overwrites main's results with that ref's code and corrupts
# main's quality history. A `pull_request:` trigger is therefore invalid here
# until this instance moves to Developer Edition.
#
# The `if: github.ref` guard covers the same hole via workflow_dispatch, which
# otherwise allows dispatching the scan from an arbitrary ref.
#
# No quality-gate step. This repo onboards in report-only mode because a
# blocking gate on the first scan fails on untriaged pre-existing findings.
name: SonarQube Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube Scan
    # Without this, a manual dispatch from a feature branch overwrites main's
    # analysis. See the header comment.
    if: github.ref == 'refs/heads/main'
    runs-on: arc-shared
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # full history: SonarQube needs it for blame attribution and to
          # compute the new-code period
          fetch-depth: 0
          # Nothing in this job pushes or fetches again, so GITHUB_TOKEN does not
          # need to persist into local git config where later steps could read it.
          persist-credentials: false
      - name: SonarQube Scan
        # Pinned to a commit SHA, not a tag: this step receives SONAR_TOKEN, so
        # a retargeted or compromised release tag would hand credentials to
        # replacement action code.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
