sonar.projectKey=chimely
sonar.projectName=chimely

sonar.sources=.
sonar.tests=.

# The test patterns below appear in BOTH sonar.exclusions and
# sonar.test.inclusions, deliberately. `sonar.sources=.` indexes them as MAIN
# code, and sonar.test.inclusions alone does NOT remove them from the source
# set -- so without the matching exclusions the scanner aborts the whole
# analysis with "File ... can't be indexed twice".
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/target/**,tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.test.inclusions=tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# The Sonar Rust analyzer RUNS `cargo clippy` ITSELF by default -- it is not a
# passive report reader. The arc-shared runner image is upstream
# actions-runner + dirmngr and nothing else: no cargo, no rustc, no linker.
# Leaving this enabled fails the scan on a missing toolchain. Clippy still runs
# in this repo's own Rust CI workflow, which is where it belongs; disabling it
# here does not reduce lint coverage. `Sensor Rust [rust]` still runs, so
# metrics, complexity and duplication are unaffected.
sonar.rust.clippy.enabled=false
